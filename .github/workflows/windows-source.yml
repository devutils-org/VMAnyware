name: Windows client source

'on':
  push:
    paths:
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-source.yml'
  pull_request:
    paths:
      - 'apps/client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Record actual Windows build environment
        run: |
          [System.Environment]::OSVersion.VersionString
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          rustup show active-toolchain
      - name: Prepare bundled frontend
        run: |
          npm --prefix apps/client ci
          npm --prefix apps/client run build
      - name: Build actual Windows client with bundled assets
        run: cargo build --locked -p vmanyware-client --features tauri/custom-protocol
