[package]
license.workspace = true
name = "vmanyware-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "vmanyware_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "=0.7.1"

[target.'cfg(unix)'.dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "encryption"] }
rand = "0.10"
zeroize = "1"
tempfile = "3"
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
portable-pty = "=0.9.0"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
