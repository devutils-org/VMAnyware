[package]
license = "MIT OR Apache-2.0"
name = "vmanyware-ssh-spike"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
portable-pty = "=0.9.0"
tempfile = "3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
